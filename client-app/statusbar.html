<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP status</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
  <style>
    body { background: transparent; }
    /* The status bar sits in a transparent always-on-top window, so it is
       centred on screen rather than filling it. */
    .bar-wrap { display: flex; justify-content: center; }
    .statusbar { width: max-content; min-width: 320px; }
  </style>
</head>
<body class="overlay-body">
  <div class="bar-wrap">
    <div class="statusbar" id="statusBar" data-status="idle">
      <span class="nav-mark" style="width:26px;height:26px;border-radius:var(--r-xs)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
          <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
        </svg>
      </span>

      <span style="font-weight:800;font-size:14px;letter-spacing:-.02em">Cafe<span style="color:var(--accent)">XP</span></span>

      <span class="badge" id="statusBadge"><span class="dot" id="statusDot"></span><span id="statusText">CONNECTING</span></span>

      <span class="grow"></span>

      <span class="chip-label">Uptime</span>
      <span class="mono num" id="timer" style="font-size:13px;font-weight:650">00:00:00</span>
    </div>
  </div>

  <script src="statusbar.js"></script>
</body>
</html>
