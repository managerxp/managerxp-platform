<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP timer</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
  <style>
    body { background: transparent; }
    .timercard { transition: box-shadow var(--dur-slow) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
    .timercard.glow {
      border-color: var(--st-line, var(--accent-line));
      box-shadow: var(--shadow-3), 0 0 26px var(--st-glow, var(--accent-glow));
    }
  </style>
</head>
<body class="overlay-body">
  <div class="timercard" id="timerCard" data-status="gaming">
    <div class="timercard-app" id="appName">Session</div>
    <div class="timercard-time" id="timerDisplay">00:00</div>
    <div class="meter meter-sm" style="margin-top:10px">
      <div class="meter-fill" id="progressFill" style="width:100%"></div>
    </div>
    <div class="timercard-label" id="timerLabel">Remaining</div>
  </div>

  <script src="timercard.js"></script>
</body>
</html>
