<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop"></div>

  <main class="kiosk">
    <div class="kiosk-inner" id="kioskInner">
      <div class="kiosk-mark">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
          <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
        </svg>
      </div>

      <div class="kiosk-word">Cafe<span>XP</span></div>

      <h1 class="kiosk-head">This station is ready</h1>
      <p class="kiosk-text">
        Sign in to see your games, order food and track your session.<br />
        New here? Create an account — it takes a few seconds.
      </p>

      <div class="kiosk-actions">
        <button class="btn btn-primary btn-hero" id="loginBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <path d="m10 17 5-5-5-5M15 12H3"></path>
          </svg>
          <span>Sign in</span>
        </button>
        <button class="btn btn-outline btn-hero" id="registerBtn">Create account</button>
      </div>

      <div class="kiosk-pc">
        <span class="dot" id="statusDot" data-status="idle"></span>
        <span class="chip-label">Station</span>
        <span class="kiosk-pc-name" id="clientName">—</span>
        <span class="badge" id="statusBadge" data-status="idle">Checking</span>
      </div>
    </div>
  </main>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/window-controls.js"></script>
  <script>
    (function () {
      "use strict";
      var Motion = window.CXMotion;

      var statusBadge = document.getElementById("statusBadge");
      var statusDot = document.getElementById("statusDot");
      var clientNameEl = document.getElementById("clientName");

      function updateStatusUI(status) {
        var online = status === "CONNECTED";
        statusBadge.setAttribute("data-status", online ? "online" : "offline");
        statusBadge.textContent = online ? "Connected" : "Disconnected";
        statusDot.setAttribute("data-status", online ? "online" : "offline");
        statusDot.classList.toggle("dot-live", online);
      }

      document.getElementById("loginBtn").addEventListener("click", function () {
        window.api.navigateTo("login");
      });
      document.getElementById("registerBtn").addEventListener("click", function () {
        window.api.navigateTo("register");
      });

      window.api.getPcName(function (name) {
        clientNameEl.textContent = name || "Unknown";
      });
      window.api.onPcName(function (name) {
        clientNameEl.textContent = name || "Unknown";
      });

      window.api.getStatus(updateStatusUI);
      window.api.onStatus(updateStatusUI);

      Motion.enter(document.getElementById("kioskInner"), { y: 16, duration: 0.42 });
    })();
  </script>
</body>
</html>
