<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ConnectXP - Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
      50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.8); }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #0c4a6e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .welcome-container {
      width: 100%;
      max-width: 600px;
      padding: 40px;
      animation: fadeIn 0.8s ease-out;
    }

    .welcome-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: slideInUp 0.6s ease-out;
    }

    .logo-section {
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }

    .logo-icon {
      font-size: 80px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-text {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .logo-subtitle {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .welcome-message {
      margin: 40px 0;
      animation: fadeIn 0.8s ease-out 0.3s both;
    }

    .welcome-text {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
      border: 2px solid rgba(34, 197, 94, 0.5);
      border-radius: 12px;
      padding: 12px 24px;
      margin: 20px 0;
      color: #22c55e;
      font-weight: 600;
      font-size: 14px;
      animation: glow 2s ease-in-out infinite;
      transition: all 0.3s ease;
    }

    .status-badge.disconnected {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.2) 100%);
      border: 2px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      animation: none;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      animation: pulse 1s ease-in-out infinite;
      transition: all 0.3s ease;
    }

    .status-badge.disconnected .status-dot {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }

    .pc-name {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 40px;
      animation: fadeIn 0.8s ease-out 0.4s both;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .features {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out 0.5s both;
    }

    .features-title {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .features-list {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .feature-item {
      text-align: center;
    }

    .feature-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .feature-name {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <div class="welcome-card">
      <div class="logo-section">
        <div class="logo-icon">🔗</div>
        <div class="logo-text">ConnectXP</div>
        <div class="logo-subtitle">Client Manager</div>
      </div>

      <div class="welcome-message">
        <div class="welcome-text">Welcome to ConnectXP</div>
        <div class="status-badge" id="statusBadge">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">PC Connected</span>
        </div>
        <div class="pc-name">
          Client ID: <span id="clientName">Initializing...</span>
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="loginBtn">Login to Account</button>
        <button class="btn btn-secondary" id="registerBtn">Create New Account</button>
      </div>

      <div class="features">
        <div class="features-title">Key Features</div>
        <div class="features-list">
          <div class="feature-item">
            <div class="feature-icon">⚡</div>
            <div class="feature-name">Fast Setup</div>
          </div>
          <div class="feature-item">
            <div class="feature-icon">🔒</div>
            <div class="feature-name">Secure</div>
          </div>
          <div class="feature-item">
            <div class="feature-icon">📊</div>
            <div class="feature-name">Real-time</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const clientNameEl = document.getElementById('clientName');
    
     // Function to update status UI
     function updateStatusUI(status) {
       if (status === "CONNECTED") {
         statusBadge.classList.remove('disconnected');
         statusText.textContent = 'PC Connected';
       } else if (status === "DISCONNECTED") {
         statusBadge.classList.add('disconnected');
         statusText.textContent = 'PC Disconnected';
       }
     }
   
     document.getElementById('loginBtn').addEventListener('click', () => {
       window.api.navigateTo('login');
     });

    document.getElementById('registerBtn').addEventListener('click', () => {
      window.api.navigateTo('register');
    });

    // Get PC name on page load
    window.api.getPcName((name) => {
      clientNameEl.textContent = name || 'Unknown';
    });
   // Initialize with current status on page load
   window.api.getStatus((status) => {
     updateStatusUI(status);
   });
   
   // Listen for real-time status updates
    window.api.onStatus((status) => {
       updateStatusUI(status);
    });
  </script>
</body>
</html>
