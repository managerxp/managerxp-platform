<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop">
    <!-- A café's own uploaded background, shown in place of the plain glow
         above once one actually arrives (see applyCafeBranding below) — at
         most one of these is ever visible; which one depends on
         wallpaperType, not on which happens to have a src set. -->
    <img class="kiosk-wallpaper" id="kioskWallpaperImg" alt="" />
    <video class="kiosk-wallpaper" id="kioskWallpaperVideo" muted loop autoplay playsinline></video>
    <div class="kiosk-wallpaper-scrim"></div>
  </div>

  <main class="kiosk">
    <div class="kiosk-inner" id="kioskInner">
      <div class="kiosk-mark">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
          <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
        </svg>
      </div>
      <img class="kiosk-logo" id="kioskLogo" alt="" />

      <div class="kiosk-word" id="kioskWord">Cafe<span>XP</span></div>
      <p class="powered-by">Powered by <strong>ManagerXP</strong></p>

      <h1 class="kiosk-head" id="kioskHead">This station is ready</h1>
      <p class="kiosk-text" id="kioskText">
        Sign in to see your games, order food and track your session.<br />
        New here? Create an account — it takes a few seconds.
      </p>

      <div class="kiosk-actions" id="kioskActions">
        <button class="btn btn-primary btn-hero" id="loginBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <path d="m10 17 5-5-5-5M15 12H3"></path>
          </svg>
          <span>Sign in</span>
        </button>
        <button class="btn btn-outline btn-hero" id="registerBtn">Create account</button>
      </div>

      <!-- Shown instead of the actions above while this station's own PC
           status (pushed by the console, see onStationStatus) is
           MAINTENANCE — same page, same layout, just nothing to sign in to. -->
      <div class="kiosk-actions hidden" id="kioskMaintenanceBadge">
        <span class="badge badge-lg" data-status="maintenance">
          <span class="dot"></span>Under maintenance
        </span>
      </div>

      <div class="kiosk-pc">
        <span class="dot" id="statusDot" data-status="idle"></span>
        <span class="chip-label">Station</span>
        <span class="kiosk-pc-name" id="clientName">—</span>
        <span class="badge" id="statusBadge" data-status="idle">Checking</span>
      </div>
    </div>
  </main>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/window-controls.js"></script>
  <script>
    (function () {
      "use strict";
      var Motion = window.CXMotion;

      var statusBadge = document.getElementById("statusBadge");
      var statusDot = document.getElementById("statusDot");
      var clientNameEl = document.getElementById("clientName");
      var kioskWordEl = document.getElementById("kioskWord");
      var kioskLogoEl = document.getElementById("kioskLogo");
      var kioskInner = document.getElementById("kioskInner");
      var kioskHeadEl = document.getElementById("kioskHead");
      var kioskTextEl = document.getElementById("kioskText");
      var kioskActionsEl = document.getElementById("kioskActions");
      var kioskMaintenanceBadgeEl = document.getElementById("kioskMaintenanceBadge");
      var READY_HEAD = kioskHeadEl.textContent;
      var backdropEl = document.querySelector(".backdrop");
      var wallpaperImgEl = document.getElementById("kioskWallpaperImg");
      var wallpaperVideoEl = document.getElementById("kioskWallpaperVideo");

      /* wallpaperUrl arrives as a relative /uploads/... path — the same
         address rule as everything else this station fetches from the
         backend (see main.js's SET_NAME handler). getBackendBase and
         getCafeBranding are two independent pulls with no guaranteed order,
         so the wallpaper src is built fresh from whatever API_BASE is
         current each time either one resolves, rather than only once. */
      var API_BASE = "http://localhost:5000";
      if (window.api.getBackendBase) window.api.getBackendBase(function (b) { if (b) { API_BASE = b; paintWallpaper(); } });
      if (window.api.onBackendBase) window.api.onBackendBase(function (b) { if (b) { API_BASE = b; paintWallpaper(); } });

      /* Café's own trading name, if set, over its registration name, over
         the generic default — same precedence billing.js already uses on
         the console side. Either can arrive after the other (registration
         name rides SET_NAME, trading name/logo follow separately), so both
         paths repaint through the same function rather than assuming order. */
      var cafeRegName = "", cafeBusinessName = "";
      function paintBrandWord() {
        var name = cafeBusinessName || cafeRegName;
        if (name) kioskWordEl.textContent = name;
      }
      if (window.api.getCafeName) {
        window.api.getCafeName(function (name) { cafeRegName = name || ""; paintBrandWord(); });
      }
      if (window.api.onCafeName) {
        window.api.onCafeName(function (name) { cafeRegName = name || ""; paintBrandWord(); });
      }

      var cafeWallpaperUrl = "", cafeWallpaperType = "";
      function paintWallpaper() {
        if (!cafeWallpaperUrl) return;
        var el = cafeWallpaperType === "video" ? wallpaperVideoEl : wallpaperImgEl;
        var other = el === wallpaperVideoEl ? wallpaperImgEl : wallpaperVideoEl;
        other.classList.remove("is-active");
        other.removeAttribute("src");
        el.src = API_BASE + cafeWallpaperUrl;
        el.classList.add("is-active");
        backdropEl.classList.add("has-wallpaper");
      }

      function applyCafeBranding(b) {
        b = b || {};
        cafeBusinessName = b.businessName || "";
        paintBrandWord();
        if (b.logo) {
          kioskLogoEl.src = b.logo;
          kioskInner.classList.add("kiosk-has-logo");
        }
        if (b.wallpaperUrl) {
          cafeWallpaperUrl = b.wallpaperUrl;
          cafeWallpaperType = b.wallpaperType || "";
          paintWallpaper();
        }
      }
      if (window.api.getCafeBranding) window.api.getCafeBranding(applyCafeBranding);
      if (window.api.onCafeBranding) window.api.onCafeBranding(applyCafeBranding);

      function updateStatusUI(status) {
        var online = status === "CONNECTED";
        statusBadge.setAttribute("data-status", online ? "online" : "offline");
        statusBadge.textContent = online ? "Connected" : "Disconnected";
        statusDot.setAttribute("data-status", online ? "online" : "offline");
        statusDot.classList.toggle("dot-live", online);
      }

      /* Same page, same layout — under maintenance just swaps the heading
         and replaces "Sign in / Create account" with a plain status badge,
         so a customer at this station sees why rather than a dead end. */
      function applyStationStatus(status) {
        var underMaintenance = status === "MAINTENANCE";
        kioskHeadEl.textContent = underMaintenance ? "Under maintenance" : READY_HEAD;
        kioskTextEl.classList.toggle("hidden", underMaintenance);
        kioskActionsEl.classList.toggle("hidden", underMaintenance);
        kioskMaintenanceBadgeEl.classList.toggle("hidden", !underMaintenance);
      }
      if (window.api.getStationStatus) window.api.getStationStatus(applyStationStatus);
      if (window.api.onStationStatus) window.api.onStationStatus(applyStationStatus);

      document.getElementById("loginBtn").addEventListener("click", function () {
        window.api.navigateTo("login");
      });
      document.getElementById("registerBtn").addEventListener("click", function () {
        window.api.navigateTo("register");
      });

      window.api.getPcName(function (name) {
        clientNameEl.textContent = name || "Unknown";
      });
      window.api.onPcName(function (name) {
        clientNameEl.textContent = name || "Unknown";
      });

      window.api.getStatus(updateStatusUI);
      window.api.onStatus(updateStatusUI);

      Motion.enter(document.getElementById("kioskInner"), { y: 16, duration: 0.42 });
    })();
  </script>
</body>
</html>
