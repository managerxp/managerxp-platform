<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP — Reset password</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop"></div>

  <main class="stage">
    <section class="auth-card" id="authCard">
      <div class="auth-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="auth-title" id="stepTitle">Reset your password</h1>
      <p class="auth-sub" id="stepSub">
        Enter the email on your account — this works whether you play here as a
        customer or manage the café.
      </p>

      <!-- STEP 1: request a code -->
      <form class="auth-form" id="emailForm" novalidate>
        <div class="field">
          <label class="field-label" for="fpEmail">Email</label>
          <input class="input" type="email" id="fpEmail" placeholder="you@example.com"
                 autocomplete="email" autofocus />
        </div>

        <div class="notice hidden" data-status="error" id="emailError" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="sendBtn">
          <span class="btn-label" id="sendText">Send reset code</span>
        </button>
      </form>

      <!-- STEP 2: enter the code and a new password -->
      <form class="auth-form hidden" id="resetForm" novalidate>
        <div class="notice" data-status="online" id="codeNotice"></div>

        <div class="field">
          <label class="field-label" for="fpOtp">6-digit code</label>
          <input class="input mono" type="text" id="fpOtp" placeholder="000000"
                 inputmode="numeric" maxlength="6" autocomplete="one-time-code"
                 style="text-align:center;letter-spacing:0.5em;font-size:18px" />
        </div>

        <div class="field">
          <label class="field-label" for="fpPassword">New password</label>
          <input class="input" type="password" id="fpPassword" placeholder="At least 8 characters"
                 autocomplete="new-password" />
        </div>

        <div class="field">
          <label class="field-label" for="fpConfirm">Confirm password</label>
          <input class="input" type="password" id="fpConfirm" placeholder="Type it again"
                 autocomplete="new-password" />
        </div>

        <div class="notice hidden" data-status="error" id="resetError" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="resetBtn">
          <span class="btn-label" id="resetText">Change password</span>
        </button>

        <button type="button" class="btn btn-ghost btn-sm btn-block" id="resendBtn" style="margin-top:8px">
          Didn't get a code? Send another
        </button>
      </form>

      <div class="auth-alt">
        <button type="button" id="toLogin">Back to sign in</button>
      </div>
    </section>
  </main>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/window-controls.js"></script>
  <script>
    (function () {
      "use strict";
      var Motion = window.CXMotion;

      var stepTitle = document.getElementById("stepTitle");
      var stepSub = document.getElementById("stepSub");
      var card = document.getElementById("authCard");

      var emailForm = document.getElementById("emailForm");
      var fpEmail = document.getElementById("fpEmail");
      var emailError = document.getElementById("emailError");
      var sendBtn = document.getElementById("sendBtn");
      var sendText = document.getElementById("sendText");

      var resetForm = document.getElementById("resetForm");
      var codeNotice = document.getElementById("codeNotice");
      var fpOtp = document.getElementById("fpOtp");
      var fpPassword = document.getElementById("fpPassword");
      var fpConfirm = document.getElementById("fpConfirm");
      var resetError = document.getElementById("resetError");
      var resetBtn = document.getElementById("resetBtn");
      var resetText = document.getElementById("resetText");
      var resendBtn = document.getElementById("resendBtn");

      var email = "";

      Motion.enter(card, { y: 18, duration: 0.4 });

      document.getElementById("toLogin").addEventListener("click", function () {
        window.api.navigateTo("login");
      });

      function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }

      function showEmailError(message) {
        emailError.textContent = message;
        emailError.classList.remove("hidden");
        Motion.shake(card);
      }
      function showResetError(message) {
        resetError.textContent = message;
        resetError.classList.remove("hidden");
        Motion.shake(card);
      }

      /*
       * The backend never says whether an email exists — it answers the same
       * way either way, so a thrown error here means the request itself
       * failed to reach the server, not that the email was wrong.
       */
      function post(path, body) {
        return fetch("http://localhost:5000" + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok || data.success === false) {
              throw new Error(data.message || "Something went wrong. Please try again.");
            }
            return data;
          });
        });
      }

      function requestCode() {
        return post("/api/account/forgot-password", { email: email }).then(function (data) {
          var note = "If that email has an account, a 6-digit code is on its way. It expires in 10 minutes.";
          // Only ever populated when this café's server has no mail transport
          // configured — so whoever is testing it is not locked out over a
          // missing SMTP setting.
          if (data && data.data && data.data.otp_debug) {
            note += " (Email is not configured here — your code: " + data.data.otp_debug + ")";
          }
          codeNotice.textContent = note;
        });
      }

      emailForm.addEventListener("submit", function (e) {
        e.preventDefault();
        emailError.classList.add("hidden");

        var value = fpEmail.value.trim();
        if (!value) { showEmailError("Enter your email address."); return; }
        if (!isValidEmail(value)) { showEmailError("That email address doesn't look right."); return; }

        email = value;
        sendBtn.disabled = true;
        sendText.textContent = "Sending…";

        requestCode()
          .then(function () {
            stepTitle.textContent = "Enter the code";
            stepSub.textContent = "Check " + email + " for a 6-digit code, then choose a new password.";
            emailForm.classList.add("hidden");
            resetForm.classList.remove("hidden");
            fpOtp.focus();
          })
          .catch(function (err) { showEmailError(err.message); })
          .finally(function () {
            sendBtn.disabled = false;
            sendText.textContent = "Send reset code";
          });
      });

      resendBtn.addEventListener("click", function () {
        resetError.classList.add("hidden");
        resendBtn.disabled = true;
        requestCode()
          .then(function () { fpOtp.value = ""; fpOtp.focus(); })
          .catch(function (err) { showResetError(err.message); })
          .finally(function () { resendBtn.disabled = false; });
      });

      resetForm.addEventListener("submit", function (e) {
        e.preventDefault();
        resetError.classList.add("hidden");

        var otp = fpOtp.value.trim();
        var password = fpPassword.value;
        var confirm = fpConfirm.value;

        if (!/^\d{6}$/.test(otp)) { showResetError("Enter the 6-digit code from your email."); return; }
        if (password.length < 8) { showResetError("Use a password of at least 8 characters."); return; }
        if (password !== confirm) { showResetError("Those passwords do not match."); return; }

        resetBtn.disabled = true;
        resetText.textContent = "Changing…";

        post("/api/account/reset-password", { email: email, otp: otp, password: password })
          .then(function () {
            stepTitle.textContent = "Password changed";
            stepSub.textContent = "Taking you to sign in.";
            resetForm.classList.add("hidden");
            setTimeout(function () { window.api.navigateTo("login"); }, 1600);
          })
          .catch(function (err) {
            showResetError(err.message);
            resetBtn.disabled = false;
            resetText.textContent = "Change password";
          });
      });

      [fpOtp, fpPassword, fpConfirm].forEach(function (el) {
        el.addEventListener("input", function () { resetError.classList.add("hidden"); });
      });
      fpEmail.addEventListener("input", function () { emailError.classList.add("hidden"); });
    })();
  </script>
</body>
</html>
