<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop"></div>

  <main class="kiosk">
    <div class="kiosk-inner">
      <div class="conn-orb" id="connOrb" data-status="idle">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5a10 10 0 0 1 14 0"></path>
          <path d="M8.5 16a5 5 0 0 1 7 0"></path>
          <path d="M12 20h.01"></path>
          <path d="M2 9a15 15 0 0 1 20 0"></path>
        </svg>
      </div>

      <div class="kiosk-word">Cafe<span>XP</span></div>
      <h1 class="kiosk-head" id="connHead">Connecting to the café server</h1>
      <p class="kiosk-text" id="connText">Hold on — this station is looking for the CafeXP server on your network.</p>

      <div class="kiosk-pc">
        <span class="dot" id="connDot" data-status="idle"></span>
        <span class="chip-label">Station</span>
        <span class="kiosk-pc-name" id="clientIdValue">Not assigned</span>
      </div>

      <div class="conn-log" id="logs" aria-label="Connection log"></div>
    </div>
  </main>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/window-controls.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
