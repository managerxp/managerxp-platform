<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ConnectXP - Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #ff0033;
      --dark-red: #8a001c;
      --accent-green: #00ff41;
      --bg-dark: #050505;
      --text-main: #ffffff;
      --text-dim: #888888;
      --border-tech: #222222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden; /* Prevent scroll on body */
      display: flex;
      position: relative;
    }

    /* --- Background Effects --- */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 0, 51, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 51, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }

    /* --- Split Layout Containers --- */
    .brand-panel {
      flex: 1;
      background: linear-gradient(135deg, #0a0a0a 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid var(--border-tech);
      position: relative;
      z-index: 1;
      padding: 40px;
      clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%); /* Slight angle */
    }
    
    /* Decorative glowing line on split */
    .brand-panel::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--primary-red), transparent);
      box-shadow: 0 0 15px var(--primary-red);
    }

    .form-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      padding: 40px;
      overflow-y: auto; /* Scroll for form if needed */
    }

    /* --- Branding Section (Left) --- */
    .brand-content {
      text-align: center;
      max-width: 400px;
    }

    .brand-logo {
      font-size: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px var(--primary-red));
      animation: float 6s ease-in-out infinite;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px var(--primary-red);
      margin-bottom: 10px;
    }

    .brand-subtitle {
      font-family: 'Orbitron', sans-serif;
      color: #444;
      letter-spacing: 4px;
      font-size: 14px;
      margin-bottom: 50px;
    }

    /* HUD Stats decorations */
    .hud-stats {
      width: 100%;
      border-top: 1px solid #222;
      padding-top: 30px;
      display: flex;
      justify-content: space-around;
    }

    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      color: var(--primary-red);
      font-weight: 700;
    }
    .stat-label {
      font-size: 12px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- Form Section (Right) --- */
    .register-form-wrapper {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .form-header {
      margin-bottom: 30px;
      border-left: 3px solid var(--primary-red);
      padding-left: 20px;
    }

    .form-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 5px;
    }

    .form-desc {
      color: #555;
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 5px;
      position: relative;
    }
    
    .full-width {
        grid-column: span 2;
    }

    label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #666;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #0a0a0a;
      border: 1px solid #222;
      color: var(--text-main);
      font-size: 16px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      transition: all 0.3s ease;
      border-radius: 0;
    }

    input:focus {
      outline: none;
      background: #000;
      border-color: var(--primary-red);
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.2);
    }

    /* Password Requirements - Inline Style for PC */
    .password-requirements {
      grid-column: span 2;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #1a1a1a;
      padding: 15px;
      display: none;
      margin-bottom: 15px;
      border-left: 2px solid var(--primary-red);
    }
    
    .password-requirements.show { display: block; }

    .req-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .requirement {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .requirement.met { color: var(--accent-green); }
    .requirement-icon { width: 10px; }

    /* Checkboxes & Buttons */
    .terms-checkbox {
      grid-column: span 2;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 10px 0 20px 0;
    }

    input[type="checkbox"] {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #111;
      border: 1px solid #333;
      cursor: pointer;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }
    input[type="checkbox"]:checked::after {
      content: "✓";
      display: block;
      text-align: center;
      color: #fff;
      font-size: 10px;
      line-height: 16px;
    }

    .btn-primary {
      grid-column: span 2;
      padding: 16px;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primary-red), var(--dark-red));
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
      transition: all 0.3s ease;
      clip-path: polygon(0 0, 100% 0, 98% 100%, 0% 100%);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-link {
      grid-column: span 2;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
    .login-link a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid transparent;
      transition: all 0.3s;
    }
    .login-link a:hover {
      color: var(--primary-red);
      border-bottom: 1px solid var(--primary-red);
    }

    /* Messages */
    .error-message, .success-message {
      grid-column: span 2;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    .error-message {
      border: 1px solid rgba(255, 0, 51, 0.3);
      color: #ff4d4d;
      background: rgba(255, 0, 51, 0.05);
    }
    .success-message {
      border: 1px solid rgba(0, 255, 65, 0.3);
      color: var(--accent-green);
      background: rgba(0, 255, 65, 0.05);
    }
    .show { display: block; }

    /* Back Button */
    .back-button {
      position: absolute;
      top: 30px;
      left: 30px;
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 10px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      z-index: 10;
      cursor: pointer;
      transition: 0.3s;
    }
    .back-button:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .brand-panel { display: none; }
        .form-panel { flex: 1; }
        .form-grid { grid-template-columns: 1fr; }
        .full-width, .password-requirements, .terms-checkbox, .btn-primary, .login-link, .error-message, .success-message { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <button class="back-button" id="backBtn">← Back</button>

  <!-- Left Side: Branding -->
  <div class="brand-panel">
    <div class="brand-content">
      <div class="brand-logo">🔗</div>
      <div class="brand-title">ConnectXP</div>
      <div class="brand-subtitle">Gaming Network</div>
      
      <div class="hud-stats">
        <div class="stat-item">
          <div class="stat-value">24/7</div>
          <div class="stat-label">Uptime</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">256-Bit</div>
          <div class="stat-label">Encryption</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="form-panel">
    <div class="register-form-wrapper">
      <div class="form-header">
        <div class="form-title">Create Account</div>
        <div class="form-desc">Join the network. Fill in your details below.</div>
      </div>

      <form id="registerForm">
        <!-- Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="form-grid">
          <!-- Row 1 -->
          <div class="form-group">
            <label for="customer_name">Full Name</label>
            <input type="text" id="customer_name" name="customer_name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <!-- Row 2 -->
          <div class="form-group full-width">
            <label for="phone_number">Phone Number</label>
            <input type="tel" id="phone_number" name="phone_number" placeholder="10-15 digit number" required />
          </div>

          <!-- Row 3 -->
          <div class="form-group full-width">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Street, city, state" required />
          </div>

          <!-- Row 4 -->
          <div class="form-group full-width">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create password" required />
          </div>

          <!-- Requirements Box -->
          <div class="password-requirements" id="passwordReqs">
            <div style="font-family: 'Orbitron'; font-size: 10px; margin-bottom: 8px; color: #888;">SECURITY PROTOCOL:</div>
            <div class="req-grid">
                <div class="requirement" id="req-length">
                  <span class="requirement-icon">✗</span> 6+ Characters
                </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="registerBtn">
            <span class="spinner" style="display: none;"></span>
            <span id="registerText">Initialize Account</span>
          </button>

          <div class="login-link">
            Already have an account? <a href="#" id="loginLink">Sign in</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('customer_name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone_number');
    const addressInput = document.getElementById('address');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const registerBtn = document.getElementById('registerBtn');
    const registerText = document.getElementById('registerText');
    const spinner = registerBtn.querySelector('.spinner');
    const passwordReqs = document.getElementById('passwordReqs');

    document.getElementById('backBtn').addEventListener('click', () => {
      window.api.navigateTo('welcome');
    });

    document.getElementById('loginLink').addEventListener('click', (e) => {
      e.preventDefault();
      window.api.navigateTo('login');
    });

    passwordInput.addEventListener('input', validatePasswordRequirements);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const phoneNumber = phoneInput.value.trim();
      const address = addressInput.value.trim();
      const password = passwordInput.value;

      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');

      if (!name || !email || !phoneNumber || !address || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (!isValidEmail(email)) {
        showError('Please enter a valid email address');
        return;
      }

      if (!isValidPhone(phoneNumber)) {
        showError('Please enter a valid phone number (10-15 digits)');
        return;
      }

      if (!isValidPassword(password)) {
        showError('Password must be at least 6 characters long');
        return;
      }

      registerBtn.disabled = true;
      spinner.style.display = 'inline-block';
      registerText.textContent = 'Processing...';

      try {
        const response = await fetch('http://localhost:5000/api/customers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            customer_name: name, 
            email, 
            phone_number: phoneNumber,
            password,
            address
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.message || 'Registration failed');
          return;
        }

        showSuccess('Account created successfully! Redirecting...');
        
        setTimeout(() => {
          window.api.navigateTo('login');
        }, 2000);
      } catch (error) {
        showError('Connection error. Please try again.');
        console.error('Registration error:', error);
      } finally {
        registerBtn.disabled = false;
        spinner.style.display = 'none';
        registerText.textContent = 'Initialize Account';
      }
    });

    function validatePasswordRequirements() {
      const password = passwordInput.value;
      passwordReqs.classList.add('show');

      const requirements = {
        'req-length': password.length >= 6
      };

      Object.entries(requirements).forEach(([id, met]) => {
        const element = document.getElementById(id);
        if (met) {
          element.classList.add('met');
          element.querySelector('.requirement-icon').textContent = '✓';
        } else {
          element.classList.remove('met');
          element.querySelector('.requirement-icon').textContent = '✗';
        }
      });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
    }

    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function isValidPhone(phone) {
      const phoneRegex = /^[0-9]{10,15}$/;
      return phoneRegex.test(phone.replace(/[-\s]/g, ''));
    }

    function isValidPassword(password) {
      return password.length >= 6;
    }
  </script>
</body>
</html>
