<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP — Sign in</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop"></div>

  <main class="stage">
    <section class="auth-card" id="authCard">
      <div class="auth-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
          <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
        </svg>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to start your session on <strong id="pcName">this station</strong>.</p>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com"
                 autocomplete="email" autofocus />
        </div>

        <div class="field">
          <div class="row-between">
            <label class="field-label" for="password">Password</label>
            <button type="button" class="link-btn" id="toForgot" style="font-size:12px">Forgot password?</button>
          </div>
          <input class="input" type="password" id="password" placeholder="Your password"
                 autocomplete="current-password" />
        </div>

        <div class="notice hidden" data-status="error" id="errorMessage" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
          <span class="btn-label" id="loginText">Sign in</span>
        </button>
      </form>

      <!-- Shown instead of the ordinary error when the address has never
           been confirmed — customer.Controller.js's login() answers 403 with
           verification_required rather than a plain "wrong password". -->
      <form class="auth-form hidden" id="verifyForm" novalidate>
        <div class="notice" data-status="online" id="verifyNotice"></div>

        <div class="field">
          <label class="field-label" for="loginOtp">6-digit code</label>
          <input class="input mono" type="text" id="loginOtp" placeholder="000000"
                 inputmode="numeric" maxlength="6" autocomplete="one-time-code"
                 style="text-align:center;letter-spacing:0.5em;font-size:18px" />
        </div>

        <div class="notice hidden" data-status="error" id="verifyError" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="verifyBtn">
          <span class="btn-label" id="verifyText">Verify email</span>
        </button>

        <button type="button" class="btn btn-ghost btn-sm btn-block" id="resendBtn" style="margin-top:8px">
          Didn't get a code? Send another
        </button>
      </form>

      <div class="auth-alt" id="authAlt">
        New to CafeXP? <button type="button" id="toRegister">Create an account</button>
        <div style="margin-top:10px">
          <button type="button" id="toWelcome">Back</button>
        </div>
      </div>
    </section>
  </main>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/window-controls.js"></script>
  <script>
    (function () {
      "use strict";
      var Motion = window.CXMotion;

      var form = document.getElementById("loginForm");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var errorMessage = document.getElementById("errorMessage");
      var loginBtn = document.getElementById("loginBtn");
      var loginText = document.getElementById("loginText");
      var card = document.getElementById("authCard");

      var verifyForm = document.getElementById("verifyForm");
      var verifyNotice = document.getElementById("verifyNotice");
      var loginOtp = document.getElementById("loginOtp");
      var verifyError = document.getElementById("verifyError");
      var verifyBtn = document.getElementById("verifyBtn");
      var verifyText = document.getElementById("verifyText");
      var resendBtn = document.getElementById("resendBtn");
      var authAlt = document.getElementById("authAlt");
      /* Held only long enough to retry the sign-in that got refused — never
         written to disk, and cleared the moment verification succeeds or the
         person navigates away. */
      var pendingEmail = "", pendingPassword = "";

      Motion.enter(card, { y: 18, duration: 0.4 });

      window.api.getPcName(function (name) {
        if (name) document.getElementById("pcName").textContent = name;
      });

      /* Defaults to this machine, corrected to the console's real address once
         this station has been told it — see main.js's SET_NAME handler. A
         station on its own machine cannot sign a customer in against itself. */
      var API_BASE = "http://localhost:5000";
      if (window.api.getBackendBase) window.api.getBackendBase(function (b) { if (b) API_BASE = b; });
      if (window.api.onBackendBase) window.api.onBackendBase(function (b) { if (b) API_BASE = b; });

      document.getElementById("toWelcome").addEventListener("click", function () {
        window.api.navigateTo("welcome");
      });
      document.getElementById("toRegister").addEventListener("click", function () {
        window.api.navigateTo("register");
      });
      document.getElementById("toForgot").addEventListener("click", function () {
        window.api.navigateTo("forgot-password");
      });

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.remove("hidden");
        Motion.shake(card);
      }
      function clearError() { errorMessage.classList.add("hidden"); }

      function busy(on) {
        loginBtn.disabled = on;
        loginText.textContent = on ? "Signing in…" : "Sign in";
      }

      function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }

      /*
       * The actual sign-in call, pulled out so a successful verification can
       * walk straight back into it with the password still held from the
       * attempt that was refused — the person should not have to type it
       * twice just because their address needed confirming.
       */
      function signIn(email, password) {
        return fetch(API_BASE + "/api/customers/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        }).then(function (response) {
          return response.json().then(function (data) { return { response: response, data: data }; });
        });
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearError();

        var email = emailInput.value.trim();
        var password = passwordInput.value;

        if (!email || !password) { showError("Enter your email and password."); return; }
        if (!isValidEmail(email)) { showError("That email address doesn't look right."); return; }

        busy(true);
        try {
          var result = await signIn(email, password);
          var response = result.response, data = result.data;

          if (!response.ok || !data.success) {
            if (data.data && data.data.verification_required) {
              pendingEmail = email;
              pendingPassword = password;
              verifyNotice.textContent = "Enter the six-digit code sent to " + email + " to finish setting up this account.";
              form.classList.add("hidden");
              authAlt.classList.add("hidden");
              verifyForm.classList.remove("hidden");
              loginOtp.focus();
              return;
            }
            showError(data.message || "We couldn't sign you in. Check your details and try again.");
            return;
          }

          // The API returns { data: { user, token } } — the previous build read
          // data.token, which was always undefined, so no token was ever stored.
          var token = (data.data && data.data.token) || data.token;
          var user = data.data && data.data.user;

          window.api.storeToken(token);
          window.api.storeUserInfo(user);
          window.api.navigateTo("userdashboard");
        } catch (error) {
          console.error("Login error:", error);
          showError("Can't reach the café server. Please ask a staff member for help.");
        } finally {
          busy(false);
        }
      });

      [emailInput, passwordInput].forEach(function (el) {
        el.addEventListener("input", clearError);
      });

      function post(path, body) {
        return fetch(API_BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok || data.success === false) {
              throw new Error(data.message || "Something went wrong. Please try again.");
            }
            return data;
          });
        });
      }

      function showVerifyError(message) {
        verifyError.textContent = message;
        verifyError.classList.remove("hidden");
        Motion.shake(card);
      }

      verifyForm.addEventListener("submit", function (e) {
        e.preventDefault();
        verifyError.classList.add("hidden");

        var code = loginOtp.value.trim();
        if (!/^\d{6}$/.test(code)) { showVerifyError("Enter the six-digit code from your email."); return; }

        verifyBtn.disabled = true;
        verifyText.textContent = "Verifying…";

        post("/api/customers/verify-email", { email: pendingEmail, code: code })
          .then(function () { return signIn(pendingEmail, pendingPassword); })
          .then(function (result) {
            if (!result.response.ok || !result.data.success) {
              throw new Error(result.data.message || "Verified, but could not sign you in. Try again.");
            }
            pendingPassword = "";
            var data = result.data;
            var token = (data.data && data.data.token) || data.token;
            var user = data.data && data.data.user;
            window.api.storeToken(token);
            window.api.storeUserInfo(user);
            window.api.navigateTo("userdashboard");
          })
          .catch(function (err) {
            showVerifyError(err.message);
            verifyBtn.disabled = false;
            verifyText.textContent = "Verify email";
          });
      });

      resendBtn.addEventListener("click", function () {
        verifyError.classList.add("hidden");
        resendBtn.disabled = true;
        post("/api/customers/resend-verification", { email: pendingEmail })
          .then(function () { loginOtp.value = ""; loginOtp.focus(); })
          .catch(function (err) { showVerifyError(err.message); })
          .finally(function () { resendBtn.disabled = false; });
      });

      loginOtp.addEventListener("input", function () { verifyError.classList.add("hidden"); });
    })();
  </script>
</body>
</html>
