<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/portal.css" />
</head>
<body>
  <div class="backdrop"></div>

  <div class="portal">
    <!-- ==================== TOP NAVIGATION ==================== -->
    <header class="nav">
      <div class="nav-brand">
        <span class="nav-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
            <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
          </svg>
        </span>
        <span class="nav-wordmark">Cafe<span>XP</span></span>
      </div>

      <nav class="nav-links" id="navLinks"></nav>

      <div class="nav-right">
        <button class="chip-stat chip-timer" id="sessionChip" data-status="idle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
          </svg>
          <span class="col">
            <span class="chip-label">Session</span>
            <span class="chip-value" id="sessionChipValue">—</span>
          </span>
        </button>

        <button class="chip-stat" id="walletChip">
          <span id="walletChipCoin"></span>
          <span class="col">
            <span class="chip-label">XP Coin</span>
            <span class="chip-value" id="walletChipValue">—</span>
          </span>
        </button>

        <button class="btn btn-ghost btn-icon" id="notifyBtn" data-tip="Notifications" aria-label="Notifications"></button>

        <button class="nav-avatar" id="accountBtn">
          <span class="avatar-orb" id="avatarOrb">?</span>
          <span class="nav-avatar-name truncate" id="avatarName">Guest</span>
        </button>
      </div>
    </header>

    <!-- ==================== VIEWS ==================== -->
    <main class="portal-scroll" id="portalScroll">
      <div id="viewHost"></div>
    </main>
  </div>

  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/icons.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/coin.js"></script>
  <script src="app/session.js"></script>
  <script src="app/wallet.js"></script>
  <script src="app/views.js"></script>
  <script src="app/portal.js"></script>
</body>
</html>
