<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP — Sign in</title>

  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />

  <style>
    body {
      display: grid;
      place-items: center;
      padding: var(--s-6);
      background: var(--bg-base);
    }

    .auth {
      width: 100%;
      max-width: 400px;
      padding: var(--s-8) var(--s-6) var(--s-6);
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-3);
      animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    .auth-brand { text-align: center; margin-bottom: var(--s-6); }
    .auth-mark {
      display: grid;
      place-items: center;
      width: 52px; height: 52px;
      margin: 0 auto var(--s-4);
      border-radius: var(--r-lg);
      background: linear-gradient(145deg, var(--accent-hot), var(--accent-deep));
      color: #fff;
      box-shadow: 0 8px 28px rgba(255, 23, 68, 0.32);
    }
    .auth-title { font-size: 24px; font-weight: 750; letter-spacing: -0.025em; }
    .auth-title span { color: var(--accent); }
    .auth-sub {
      margin-top: 4px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .auth-lede {
      margin-top: var(--s-4);
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      margin: var(--s-5) 0 var(--s-4);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: var(--track-caps);
      text-transform: uppercase;
      color: var(--text-3);
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* login.js toggles .show on these two */
    .error-message, .loading {
      display: none;
      margin-top: var(--s-4);
      padding: var(--s-3) var(--s-4);
      border-radius: var(--r-md);
      font-size: 12px;
      line-height: 1.5;
    }
    .error-message {
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: #ff8a80;
    }
    .loading {
      align-items: center;
      gap: var(--s-3);
      background: var(--bg-inset);
      border: 1px solid var(--line);
      color: var(--text-2);
    }
    .error-message.show { display: block; animation: rise 0.24s var(--ease-out) both; }
    .loading.show { display: flex; }

    .auth-foot {
      margin-top: var(--s-6);
      padding-top: var(--s-4);
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
    }
  </style>
</head>
<body>

  <main class="auth">
    <div class="auth-brand">
      <div class="auth-mark">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
          <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
        </svg>
      </div>
      <div class="auth-title">Cafe<span>XP</span></div>
      <div class="auth-sub">Admin Console</div>
      <p class="auth-lede">Sign in through the CafeXP web platform to manage this cafe.</p>
    </div>

    <form id="loginForm">
      <div class="col gap-2">
        <button type="button" class="btn btn-primary btn-lg btn-block" id="webBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <path d="M15 3h6v6M10 14 21 3"></path>
          </svg>
          <span>Open the web app</span>
        </button>

        <button type="button" class="btn btn-ok btn-lg btn-block" id="checkBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          <span>I've signed in — continue</span>
        </button>
      </div>

      <div class="error-message" id="errorMsg"></div>
      <div class="loading" id="loadingMsg">
        <span class="spinner"></span>
        <span>Checking your login…</span>
      </div>

      <div class="auth-divider">or paste a token</div>

      <div class="row gap-2">
        <input type="password" class="input grow mono" id="tokenInput"
               placeholder="Authentication token" autocomplete="off" style="font-size:12px" />
        <button type="button" class="btn btn-outline" id="tokenBtn">Sign in</button>
      </div>
    </form>

    <div class="auth-foot">
      Need help? <a href="mailto:support@managerxp.com">support@managerxp.com</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
