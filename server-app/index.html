<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeXP — Admin Console</title>

  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="ui/layout.css" />
  <link rel="stylesheet" href="ui/pages.css" />
</head>
<body>

  <div class="app" id="app">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
      <!-- The brand carries the real CafeXP logo when the asset is present.
           The mark and text below it are not dead weight: they are what shows
           when the sidebar is collapsed to icons, and what shows if the image
           is missing, so the console never renders a broken image where its
           own name should be. -->
      <div class="brand">
        <span class="brand-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2.5"></rect>
            <path d="M7 10v4M5 12h4M16 11h.01M18.5 13.5h.01"></path>
          </svg>
        </span>
        <img class="brand-logo" src="Images/cafexp-logo.png"
             alt="CafeXP — powered by ManagerXP"
             onerror="this.closest('.brand').classList.add('brand-no-logo'); this.remove();" />
        <div class="brand-copy grow">
          <div class="brand-text">Cafe<span>XP</span></div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>

      <!-- nav is rendered by app/router.js -->
      <div id="sidebarNav" class="grow" style="display:flex; min-height:0;"></div>

      <div class="sidebar-foot">
        <button class="user-chip" id="userChip" type="button">
          <span class="avatar" id="userAvatar">?</span>
          <span class="user-copy">
            <span class="user-name" id="userName">Not signed in</span>
            <span class="user-mail" id="userMail">—</span>
          </span>
        </button>
      </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon" id="sidebarToggle" data-tip="Collapse sidebar  (Ctrl+B)" aria-label="Toggle sidebar"></button>

        <div style="min-width:0">
          <div class="topbar-title" id="topbarTitle">Dashboard</div>
          <div class="topbar-crumb" id="topbarCrumb"></div>
        </div>

        <div class="topbar-tools">
          <div id="topbarPageTools" class="row gap-2"></div>

          <span class="status-pill" id="floorPill" data-tip="Stations online / total registered">
            <span class="dot" data-status="online"></span>
            <span><span class="num" id="pillOnline">0</span> / <span class="num" id="pillTotal">0</span> online</span>
          </span>

          <span class="clock" id="clock">--:--:--</span>

          <button class="btn btn-outline btn-sm hidden" id="updateAvailableBtn" data-tip="A new CafeXP version is available">
            <span class="btn-label">Update available</span>
          </button>

          <button class="btn btn-ghost btn-icon topbar-bell" id="notifyBell" data-tip="Notifications" aria-label="Notifications">
            <span class="topbar-bell-badge hidden" id="notifyBellBadge">0</span>
          </button>

          <button class="btn btn-ghost btn-icon" id="reconnectAllBtn" data-tip="Reconnect all stations" aria-label="Reconnect all"></button>

          <!-- Custom window controls; the OS frame is disabled -->
          <div class="win-controls" id="winControls">
            <button class="win-btn" id="winMin" aria-label="Minimise" title="Minimise">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg>
            </button>
            <button class="win-btn" id="winMax" aria-label="Maximise" title="Maximise">
              <svg viewBox="0 0 12 12" aria-hidden="true" data-restore="false">
                <rect x="2.5" y="2.5" width="7" height="7" rx="1"/>
              </svg>
            </button>
            <button class="win-btn win-btn-close" id="winClose" aria-label="Close" title="Close">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
            </button>
          </div>
        </div>
      </header>

      <div class="page-scroll" id="pageScroll">
        <div class="view-host" id="viewHost"></div>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPTS ====================
       Classic scripts (no modules): Electron loads this over file://,
       where ES module imports are blocked. Order matters. -->
  <script src="vendor/motion.min.js"></script>
  <script src="app/motion-kit.js"></script>
  <script src="app/icons.js"></script>
  <script src="app/coin.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/store.js"></script>
  <script src="app/update-schedule.js"></script>
  <script src="app/rates.js"></script>
  <script src="app/router.js"></script>

  <!-- pages (planned.js first: real pages below it replace their shells) -->
  <script src="app/pages/planned.js"></script>
  <script src="app/pages/customers.js"></script>
  <script src="app/pages/sessions.js"></script>
  <script src="app/pages/session-master.js"></script>
  <script src="app/pages/gaming-prices.js"></script>
  <script src="app/pages/game-library.js"></script>
  <script src="app/pages/game-credentials.js"></script>
  <script src="app/pages/pricing-windows.js"></script>
  <script src="app/pages/billing.js"></script>
  <script src="app/pages/counter.js"></script>
  <script src="app/pages/billing-desk.js"></script>
  <script src="app/pages/receipt-template.js"></script>
  <script src="app/pages/discounts.js"></script>
  <script src="app/pages/payments.js"></script>
  <script src="app/pages/expenses.js"></script>
  <script src="app/pages/packages.js"></script>
  <script src="app/pages/fnb.js"></script>
  <script src="app/pages/notifications.js"></script>
  <script src="app/pages/staff.js"></script>
  <script src="app/pages/dashboard.js"></script>
  <script src="app/pages/floor.js"></script>
  <script src="app/pages/reservations.js"></script>
  <script src="app/pages/station-panel.js"></script>
  <script src="app/pages/games.js"></script>
  <script src="app/pages/devices.js"></script>
  <script src="app/pages/discovery.js"></script>
  <script src="app/pages/telemetry.js"></script>
  <script src="app/pages/ai.js"></script>
  <script src="app/pages/reports.js"></script>
  <script src="app/pages/audit.js"></script>
  <script src="app/pages/logs.js"></script>
  <script src="app/pages/plan.js"></script>
  <script src="app/pages/updates.js"></script>
  <script src="app/pages/settings.js"></script>

  <script src="app/main.js"></script>
</body>
</html>
