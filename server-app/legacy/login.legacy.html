<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ServerXP - Cafe Manager Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(-50px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #0c4a6e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease-out;
    }

    .login-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.6s ease-out;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .logo-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
      animation: fadeIn 0.8s ease-out 0.3s both;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.12);
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      animation: fadeIn 0.8s ease-out 0.4s both;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .web-btn {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }

    .web-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: #3b82f6;
      color: #93c5fd;
      transform: translateY(-2px);
    }

    .error-message {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 15px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
      animation: fadeIn 0.8s ease-out 0.35s both;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider-text {
      display: inline-block;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.7);
      font-size: 12px;
      color: #94a3b8;
      position: relative;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
      animation: fadeIn 0.8s ease-out 0.5s both;
    }

    .footer-text a {
      color: #667eea;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-text a:hover {
      color: #764ba2;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo">⚡</div>
        <div class="logo-text">ServerXP</div>
        <div class="logo-subtitle">Cafe Manager Portal</div>
      </div>

      <!-- Login Instructions -->
      <div style="text-align: center; margin-bottom: 40px; animation: fadeIn 0.8s ease-out 0.2s both;">
        <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
          Click the button below to login through our web platform
        </p>
      </div>

      <!-- Login Button Group -->
      <form id="loginForm">
        <div class="button-group" style="flex-direction: column; animation: fadeIn 0.8s ease-out 0.3s both;">
          <button type="button" class="web-btn" id="webBtn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); padding: 14px 24px; font-size: 15px;">
            🌐 Login via Web App
          </button>
          <button type="button" class="check-btn" id="checkBtn" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 12px 24px; font-size: 14px; margin-top: 12px;">
            ✓ I've Logged In - Continue
          </button>
        </div>

        <div class="error-message" id="errorMsg" style="margin-top: 20px;"></div>
        <div class="loading" id="loadingMsg" style="margin-top: 20px;">
          <span class="spinner"></span>
          <span>Checking login status...</span>
        </div>

        <!-- Alternative: Manual Token Input -->
        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
          <div style="font-size: 12px; color: #94a3b8; margin-bottom: 10px; text-align: center;">
            OR paste your authentication token
          </div>
          <div style="display: flex; gap: 8px; animation: fadeIn 0.8s ease-out 0.35s both;">
            <input 
              type="password" 
              id="tokenInput" 
              placeholder="Paste your auth token here" 
              style="flex: 1; padding: 10px 12px; font-size: 12px;"
            />
            <button type="button" id="tokenBtn" style="padding: 10px 16px; background: rgba(102, 126, 234, 0.2); border: 1px solid rgba(102, 126, 234, 0.3); color: #667eea; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s ease;">
              Enter
            </button>
          </div>
        </div>
      </form>

      <div class="divider" style="margin-top: 40px; animation: fadeIn 0.8s ease-out 0.4s both;">
        <div class="divider-text">OR</div>
      </div>

      <div class="footer-text">
        Need help? Contact us at <a href="mailto:support@managerxp.com">support@managerxp.com</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
