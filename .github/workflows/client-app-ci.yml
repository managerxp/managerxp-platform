name: Client App CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "client-app/**"
      - ".github/workflows/client-app-ci.yml"
  push:
    branches: [develop]
    paths:
      - "client-app/**"
      - ".github/workflows/client-app-ci.yml"

defaults:
  run:
    working-directory: client-app

jobs:
  build:
    # electron-builder's --win target wants real Windows packaging tools
    # (NSIS, code-signing helpers) that only exist here without also pulling
    # in Wine on a Linux runner — this app only ever ships as a Windows
    # installer, so there is no cross-platform target to weigh against that.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # electron-builder downloads its packaging tools (NSIS, winCodeSign,
      # the electron zip itself, etc.) from GitHub releases on demand —
      # setup-node's npm cache above doesn't cover these. Without this, every
      # run re-fetches them from scratch, which is exactly what turned one
      # transient network blip (ECONNRESET downloading nsis-*.7z) into a
      # full build failure. Keyed on the lockfile so a dependency bump still
      # gets a fresh cache rather than a stale/mismatched one.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('client-app/package-lock.json') }}
          restore-keys: |
            electron-builder-cache-${{ runner.os }}-

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        # Unsigned — there is no code-signing certificate available in CI.
        # This proves the packaging config (icon, NSIS options, file list)
        # still produces an installer; it does not produce a release artifact.
        run: npm run dist
