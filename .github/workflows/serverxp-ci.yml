name: ServerXP CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "server-app/**"
      - ".github/workflows/serverxp-ci.yml"
  push:
    branches: [develop]
    paths:
      - "server-app/**"
      - ".github/workflows/serverxp-ci.yml"

defaults:
  run:
    working-directory: server-app

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: server-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
