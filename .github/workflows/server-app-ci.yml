name: Server App CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "server-app/**"
      - ".github/workflows/server-app-ci.yml"
  push:
    branches: [develop]
    paths:
      - "server-app/**"
      - ".github/workflows/server-app-ci.yml"

defaults:
  run:
    working-directory: server-app

jobs:
  build:
    # Same reasoning as client-app-ci.yml: electron-builder's --win target
    # wants real Windows packaging tools (NSIS, code-signing helpers) that
    # only exist here without also pulling in Wine on a Linux runner — this
    # app only ever ships as a Windows installer.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: server-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        # Unsigned — there is no code-signing certificate available in CI.
        # This proves the packaging config (icon, NSIS options, file list)
        # still produces an installer; it does not produce a release artifact.
        run: npm run dist
